name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The default profile is 'local' everywhere (the offline SQLite catalog; settings.yaml too).
# Production sets AGENT_REGISTRY_PROFILE=gcp explicitly.
env:
  AGENT_REGISTRY_PROFILE: local

jobs:
  check:
    name: lint · typecheck · test · eval (offline, no GCP SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # Install the framework-light core + dev tools from the committed lockfile, then the
      # package itself with --no-deps so the lock stays authoritative (matches pip-audit and
      # the container image). The [gcp] extra is deliberately NOT installed: tests must pass
      # with no Google Cloud SDKs, proving the local profile and the lazy-import discipline.
      - name: Install (no GCP SDKs, locked)
        run: pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff (lint + format)
        run: |
          ruff check src tests eval scripts/demo_selftest.py scripts/portability_demo.py scripts/rename_fork.py
          ruff format --check src tests eval scripts/demo_selftest.py scripts/portability_demo.py scripts/rename_fork.py

      - name: Mypy
        run: mypy src

      - name: Pytest (must pass with no Google Cloud SDKs installed)
        run: pytest -m 'not integration' -q

      - name: Eval gate (offline promotion gate, exit non-zero on fail)
        run: python eval/run_eval.py

      - name: Demo anti-rot and bounded portability evidence
        run: |
          python scripts/demo_selftest.py
          python scripts/portability_demo.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Build image
        run: docker build -t agent-registry:ci .

  terraform:
    name: terraform fmt + validate (offline, no cloud credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      # No credentials are configured and none are needed: init runs with -backend=false and
      # validate is a static check of the configuration graph.
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Init (no backend, no credentials)
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate

  supply-chain:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Audit the committed lockfiles so the result matches exactly what CI and the
      # container image install. --no-deps: the locks are fully compiled (every
      # transitive dep pinned), so audit those versions without re-resolving.
      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
