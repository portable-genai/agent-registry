# A3 Agent Registry & Governance (agent-registry) — runtime configuration.
#
# Three deployment profiles, selected by AGENT_REGISTRY_PROFILE (or profile: below):
#   gcp    : AlloyDB (or Firestore) managed catalog (lazy SDK imports). Production sets this
#            explicitly (AGENT_REGISTRY_PROFILE=gcp in the Dockerfile / Cloud Run env).
#   local  : a WORKING offline laptop catalog (SQLite, SDK-free, no API key, no emulator
#            required). Dev / test / CI set it explicitly (Makefile, ci.yaml).
#   onprem : fail-fast Google Distributed Cloud migration placeholders.
# Nothing in src/agent_registry/ above the adapters changes between profiles.
#
# The profile has NO default here, deliberately. An unset variable means nobody chose one; a
# configured-empty variable is rejected before interpolation. config.resolve_profile keeps the
# unset state distinct from a chosen `local`: the adapter family still falls back to SDK-free
# SQLite, but the loopback-dev openings that `local` is granted are withheld.

project_id: ${GOOGLE_CLOUD_PROJECT:-your-gcp-project}
region: ${GCP_REGION:-asia-southeast1}         # selected at deploy; must match Terraform
# Residency allowlist (comma separated). Mirrors the Terraform variable of the same name:
# a region outside it fails at process start, exactly as terraform plan fails.
allowed_regions: ${AGENT_REGISTRY_ALLOWED_REGIONS:-asia-southeast1}
profile: ${AGENT_REGISTRY_PROFILE:-}         # gcp | local | onprem; unset = nobody chose
# alloydb | firestore (gcp profile only). Mirrors the Terraform variable of the same name and
# CHOOSES the gcp adapter class (config.GCP_BACKEND_ADAPTERS overwrites the `gcp` entry under
# `adapters:` below at load time), so the imported adapter always matches the store Terraform
# provisioned; the `adapters.*.gcp` string below is never read for this decision.
backend: ${AGENT_REGISTRY_BACKEND:-alloydb}
kms_key: ${AGENT_REGISTRY_KMS_KEY:-}         # regional Cloud KMS key for CMEK

registry:
  name: agent-registry
  public_url: ${AGENT_REGISTRY_PUBLIC_URL:-}
  version: 0.1.0
  quality_url: ${QUALITY_GATE_URL:-}
  observability_url: ${OBSERVABILITY_URL:-}
  release_policy_version: ${RELEASE_POLICY_VERSION:-}
  release_dataset_id: ${RELEASE_DATASET_ID:-}
  release_dataset_version: ${RELEASE_DATASET_VERSION:-}
  release_dataset_digest: ${RELEASE_DATASET_DIGEST:-}
  release_evaluator: ${RELEASE_EVALUATOR:-}
  release_threshold_policy_digest: ${RELEASE_THRESHOLD_POLICY_DIGEST:-}
  release_artifact_prefixes: ${RELEASE_ARTIFACT_PREFIXES:-}
  release_redteam_categories: ${RELEASE_REDTEAM_CATEGORIES:-}

alloydb:
  instance_uri: ${AGENT_REGISTRY_ALLOYDB_URI:-}    # projects/.../locations/${GCP_REGION:-asia-southeast1}/clusters/.../instances/...
  database: agent_registry
  user: registry_app
  ip_type: PRIVATE
  table: agent_cards

firestore:
  database: ${AGENT_REGISTRY_FIRESTORE_DB:-(default)}
  collection: agent_cards

# SDK-free 'local' profile catalog store. An unset environment variable yields the package
# default under ~/.agent_registry/; an exported empty value refuses during interpolation. Tests
# pass ':memory:' for an ephemeral, deterministic store. The optional Firestore-emulator branch
# is opted into via FIRESTORE_EMULATOR_HOST (no key here).
local:
  db_path: ${AGENT_REGISTRY_LOCAL_DB:-}            # SQLite catalog file

# ----------------------------------------------------------------------------- #
# Port -> adapter bindings. The container requires an explicit entry for the active
# profile. These dotted paths are the build contract:
# each adapter class takes a single Settings argument.
#
# The `gcp` entry below is a placeholder only: Settings.from_dict overwrites it at load time
# from `backend` (see config.GCP_BACKEND_ADAPTERS), so switching backends is `backend:` /
# AGENT_REGISTRY_BACKEND alone — never hand-edit this line to pick a backend.
# ----------------------------------------------------------------------------- #
adapters:
  registry:
    gcp: agent_registry.adapters.gcp.alloydb_registry:AlloyDBRegistryAdapter
    local: agent_registry.adapters.local.sqlite_registry:SqliteRegistryAdapter
    onprem: agent_registry.adapters.onprem.registry:OnPremRegistryAdapter
