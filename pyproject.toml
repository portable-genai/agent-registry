[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-registry"
version = "0.0.1"
description = "A3 Agent Registry & Governance — governed catalog/gallery of agents (identity, ownership, scoped entitlements, A2A v1.0 + MCP 2025-11-25 discovery) for the Horizon agent platform, built ports-and-adapters on GCP (us-central1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["agent-registry", "a2a", "mcp", "agentcard", "governance", "gcp", "alloydb", "firestore", "cloud-run"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]

# Core deps are framework-light so the service and its tests install and run with no
# Google Cloud SDK. The managed-store adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repo, so CI
  # installs it with zero credentials. hex-service-kit: inbound S2S verification (web) and the
  # fail-closed bind guard. Pure-stdlib core.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.4",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Pinned per mid-2026 GCP stack. Installed only on the gcp profile / in the container.
gcp = [
  "google-cloud-alloydb-connector[pg8000]>=1.4",
  "sqlalchemy>=2.0",
  "google-cloud-firestore>=2.16",
]
dev = [
  "pytest>=8.2",
  # Pinned exactly: ruff's formatter output changes between releases, so an unpinned
  # version drifts from CI and fails `ruff format --check`. Bump deliberately.
  "ruff==0.16.3",
  "mypy>=1.10",
  "types-PyYAML",
  # agent-eval-kit: TEST-ONLY here, for assert_can_go_red. A3 is a control-plane service
  # with no model to promote, so it does not adopt the smoke/gate scaffold; the falsification
  # harness applies all the same, because a catalog-correctness metric goes falsely green as
  # easily as a judge score. Importing the package does not import the gate client.
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
]

[project.scripts]
agent-registry = "agent_registry.cli.main:main"

[project.urls]
Homepage = "https://github.com/portable-genai/agent-registry"
Specification = "https://github.com/portable-genai/compliance-advisory/blob/main/SPEC.md"

# Required for the hex-service-kit git+https pin (a direct reference).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_registry"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".agents/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Presentation/demo scripts embed long literals (AgentCard JSON, narration) where line
# length hurts more than it helps. The shipped package, tests and selected automation
# scripts remain CI-gated.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
